name: Build
permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version-file: engine/go.mod
      - name: Build and Test Engine
        run: cd engine && make

  build-go-sdk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version-file: sdk/go/go.mod
      - name: Build and Test Go SDK
        run: cd sdk/go && make

  build-agent-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version-file: workers/agent/go.mod
          cache-dependency-path: workers/agent/go.sum
      - name: Build and Test Agent Worker
        working-directory: workers/agent
        run: |
          make test
          GOWORK=off go build -mod=readonly -o "$RUNNER_TEMP/" \
            ./cmd/argyll-agent-anthropic ./cmd/argyll-agent-bedrock ./cmd/argyll-agent-gemini \
            ./cmd/argyll-agent-openai

  build-mcp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version-file: mcp/go.mod
          cache-dependency-path: mcp/go.sum
      - name: Build and Test MCP Server
        run: cd mcp && make test build

  build-chat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version-file: chat/go.mod
          cache-dependency-path: chat/go.sum
      - name: Build and Test Chat Service
        working-directory: chat
        run: |
          make check test
          GOWORK=off go build -mod=readonly -o "$RUNNER_TEMP/" ./cmd/argyll-chat

  build-python-sdk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: cd sdk/python && make install
      - name: Build and Test Python SDK
        run: cd sdk/python && make test

  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: cd web && npm ci
      - name: Type check
        run: cd web && npm run type-check
      - name: Build web app
        run: cd web && npm run build
      - name: Run tests
        run: cd web && npm test

  test-chart:
    runs-on: ubuntu-latest
    env:
      TAG: ci
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set up Helm
        uses: azure/setup-helm@v4
      - name: Lint chart
        run: helm lint deploy/helm/argyll --set publicUrl=http://argyll.test
      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          version: v0.33.0
          cluster_name: argyll
      - name: Build images
        run: |
          build() { docker build -q -t "ghcr.io/kode4food/argyll-$1:$TAG" "${@:2}"; }
          build engine -f engine/Dockerfile .
          build chat -f chat/Dockerfile .
          build mcp -f mcp/Dockerfile .
          build agent-openai --build-arg WORKER=argyll-agent-openai -f workers/agent/Dockerfile .
          build ui web
          build keycloak keycloak
          for i in engine chat mcp agent-openai ui keycloak; do
            kind load docker-image "ghcr.io/kode4food/argyll-$i:$TAG" --name argyll
          done
      - name: Install chart
        run: |
          helm install argyll deploy/helm/argyll -n argyll --create-namespace \
            --set publicUrl=http://argyll.test --set image.tag=$TAG \
            --set agents.openai.enabled=true --set ingress.enabled=false \
            --wait --timeout 10m
      - name: Test chart
        run: helm test argyll -n argyll --logs --timeout 5m
      - name: Show cluster state
        if: failure()
        run: |
          kubectl get pods -n argyll -o wide
          kubectl get events -n argyll --sort-by=.lastTimestamp | tail -40
          for p in $(kubectl get pods -n argyll -o name); do
            echo "== $p"
            kubectl logs -n argyll "$p" --all-containers --tail=40
          done

  coverage:
    runs-on: ubuntu-latest
    needs:
      [
        build-engine,
        build-go-sdk,
        build-agent-worker,
        build-mcp,
        build-chat,
        build-python-sdk,
        build-web,
      ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version-file: engine/go.mod

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python SDK dependencies
        run: cd sdk/python && make install

      - name: Install web dependencies
        run: cd web && npm ci

      - name: Sync MCP specs
        run: cd mcp && make sync-specs

      - name: Run Engine tests with coverage
        run: |
          cd engine
          go test ./... ../workers/agent/... ../mcp/... ../chat/... \
            -coverpkg=./...,../workers/agent/...,../mcp/...,../chat/... \
            -coverprofile=cover.out

      - name: Run Go SDK tests with coverage
        run: |
          cd sdk/go && go generate ./... &&
          go test ./... -coverpkg=./... -coverprofile=cover.out

      - name: Run Python SDK tests with coverage
        run: cd sdk/python && make test-cov

      - name: Run web tests with coverage
        run: cd web && npm run test:coverage

      - name: Normalize web coverage paths
        run: cd web && sed -i "s|^SF:|SF:web/|" coverage/lcov.info

      - name: Upload combined coverage to Qlty
        uses: qltysh/qlty-action/coverage@v1
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          strip-prefix: |
            github.com/kode4food/argyll/
          files: |
            engine/cover.out
            sdk/go/cover.out
            sdk/python/coverage.lcov
            web/coverage/lcov.info
