server {
    listen 3001;
    root /usr/share/nginx/html;

    # Bundled assets carry content hashes, so they never change under a name
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /env.js {
        add_header Cache-Control "no-store";
    }

    # Routes like /flow/{id} belong to the app, so unknown paths serve it
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
