openapi: 3.0.3
info:
  title: Argyll Step Interface Contract
  version: 2.0.0
  description: |
    HTTP steps are JSON endpoints invoked by the Argyll engine. The request body is the step's input arguments. Argyll execution context is sent in HTTP headers. Successful responses return output arguments directly. Failed responses use HTTP status codes and RFC 9457 Problem Details (`application/problem+json`).

    An action with `mode: sync` completes in the initial HTTP response. An action with `mode: async` returns a quick 2xx response, then completes later by POSTing its result to the action-specific webhook URL provided in `Argyll-Webhook-URL`. Invocation and compensation choose their modes independently.

servers:
  - url: "{protocol}://{host}:{port}"
    variables:
      protocol:
        enum: [http, https]
        default: http
      host:
        default: localhost
      port:
        default: "8081"

paths:
  /{endpoint}:
    post:
      summary: Handle Work Item
      description: |
        The engine calls the configured invocation or compensation endpoint
        with a flattened JSON object using invocation-mapped field names.

        An invocation receives the step's input arguments. The configured
        method may be `GET`, `POST`, `PUT`, or `DELETE`. `GET` and `DELETE`
        send no body and carry their data in endpoint placeholders.
        Invocations of a `mode: async` action also receive `Argyll-Webhook-URL`
        and complete later by POSTing to that URL.

        A compensation call is made after a compensated step fails following
        one or more successful work items. It receives the attributes marked
        `compensated` so the handler can undo the work. A `mode: async`
        compensation also receives `Argyll-Webhook-URL`; POST an empty success
        response or Problem Details to that URL when rollback finishes.

        Use `Argyll-Flow-ID`, `Argyll-Step-ID`, and `Argyll-Receipt-Token` as
        the idempotency key for side effects.

        - 2xx: a sync action succeeded, or an async action was accepted.
        - 5xx or transport error: temporary failure; the engine retries using the
          step's `work_config` backoff settings.
        - 4xx: permanent failure.
      operationId: handleWorkItem
      tags:
        - Step Execution
      parameters:
        - name: endpoint
          in: path
          required: true
          schema:
            type: string
          example: process-text
        - $ref: "#/components/parameters/ArgyllFlowID"
        - $ref: "#/components/parameters/ArgyllStepID"
        - $ref: "#/components/parameters/ArgyllReceiptToken"
        - $ref: "#/components/parameters/ArgyllWebhookURL"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Args"
            examples:
              execution:
                summary: Execute a text-processing step
                value:
                  input_text: "Hello World"
                  format: "uppercase"
              compensation:
                summary: Compensate a payment
                value:
                  amount: 49.99
                  charge_id: "ch_abc123"
      responses:
        "200":
          description: Work completed successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Args"
              examples:
                outputs:
                  value:
                    processed_text: "HELLO WORLD"
                    character_count: 11
                    processing_time_ms: 15
        "204":
          description: Work completed successfully with no body.
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"

components:
  parameters:
    ArgyllFlowID:
      name: Argyll-Flow-ID
      in: header
      required: true
      schema:
        type: string
      description: Executing flow ID.
      example: wf-123
    ArgyllStepID:
      name: Argyll-Step-ID
      in: header
      required: true
      schema:
        type: string
      description: Step ID being invoked.
      example: text-processor
    ArgyllReceiptToken:
      name: Argyll-Receipt-Token
      in: header
      required: true
      schema:
        type: string
      description: Unique work-item token for idempotency.
      example: tok_abc123xyz
    ArgyllWebhookURL:
      name: Argyll-Webhook-URL
      in: header
      required: false
      schema:
        type: string
        format: uri
      description: Async actions POST their outcome to this action-specific URL.
      example: http://localhost:8080/callbacks/wf-123/text-processor/tok_abc123xyz/invoke

  schemas:
    Args:
      type: object
      description: JSON object containing step input or output arguments.
      additionalProperties: true
      example:
        input_text: "Hello World"
        format: "uppercase"
    ProblemDetails:
      type: object
      description: RFC 9457 Problem Details response.
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
          example: Unprocessable Entity
        status:
          type: integer
          example: 422
        detail:
          type: string
          example: Invalid input format
        instance:
          type: string
          example: /flows/wf-123/steps/text-processor/tokens/tok_abc123xyz
      additionalProperties: true

  responses:
    Problem:
      description: Step failed. 4xx responses are permanent failures; 5xx responses are retryable according to step retry configuration.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            validation:
              value:
                type: about:blank
                title: Unprocessable Entity
                status: 422
                detail: Invalid input format

security: []

tags:
  - name: Step Execution
    description: Step execution endpoint contract

x-implementation-notes: |
  Success: return 2xx with a JSON object containing output arguments, or 204 when there are no outputs.
  Permanent failure: return 4xx with `Content-Type: application/problem+json`.
  Retryable failure: return 5xx, timeout, or close the connection; Argyll records the work item as not completed and applies retry policy.
  Async invocation completion: POST the success output object or problem details object to `Argyll-Webhook-URL`.
  Compensation: when handling is `compensated`, the engine sends only attributes marked `compensated` as one flattened object using invocation-mapped names; the same names resolve URL placeholders. Duplicate selected inner names are invalid. Use the receipt token as the idempotency key. A sync compensation returns 2xx on success, 5xx for a retryable failure, or 4xx for a permanent failure. An async compensation first returns 2xx to accept the work, then POSTs an empty success response or problem details to its `Argyll-Webhook-URL`.
