{{- if .Values.keycloak.enabled -}}
{{- $ctx := dict "root" . "component" "keycloak" -}}
{{- $name := include "argyll.name" $ctx -}}
{{- $db := include "argyll.name" (dict "root" . "component" "postgres") -}}
{{- if not .Values.keycloak.existingSecret }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "argyll.labels" $ctx | nindent 4 }}
  annotations:
    # Generated once, so upgrades keep the same passwords
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- range $key := list "admin-password" "argyll-admin-password" "engine-client-secret" "agent-client-secret" }}
  {{ $key }}: {{ index $existing $key | default (randAlphaNum 32 | b64enc) }}
  {{- end }}
---
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-realm
  labels:
    {{- include "argyll.labels" $ctx | nindent 4 }}
data:
  argyll-realm.json: |
    {{- .Files.Get "files/argyll-realm.json" | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "argyll.labels" $ctx | nindent 4 }}
spec:
  selector:
    {{- include "argyll.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "argyll.labels" $ctx | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "argyll.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "argyll.selectorLabels" $ctx | nindent 8 }}
    spec:
      {{- include "argyll.podDefaults" . | nindent 6 }}
      containers:
        - name: keycloak
          image: {{ include "argyll.image" (dict "root" . "name" "keycloak") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: KC_HOSTNAME
              value: {{ printf "%s/auth" (include "argyll.publicUrl" .) | quote }}
            - name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC
              value: "true"
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_PROXY_HEADERS
              value: xforwarded
            - name: KC_DB_URL
              {{- if .Values.keycloak.postgres.enabled }}
              value: jdbc:postgresql://{{ $db }}:5432/keycloak
              {{- else }}
              value: {{ printf "jdbc:postgresql://%s:%v/%s" (required "keycloak.database.host is required when keycloak.postgres.enabled is false" .Values.keycloak.database.host) .Values.keycloak.database.port .Values.keycloak.database.name | quote }}
              {{- end }}
            - name: KC_DB_USERNAME
              value: {{ ternary "keycloak" .Values.keycloak.database.user .Values.keycloak.postgres.enabled | quote }}
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  {{- if .Values.keycloak.postgres.enabled }}
                  name: {{ $db }}
                  {{- else }}
                  name: {{ required "keycloak.database.existingSecret is required when keycloak.postgres.enabled is false" .Values.keycloak.database.existingSecret }}
                  {{- end }}
                  key: password
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: admin
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "argyll.keycloakSecret" . }}
                  key: admin-password
            # The realm import fills its placeholders from these
            - name: ARGYLL_PUBLIC_URL
              value: {{ include "argyll.publicUrl" . | quote }}
            - name: ARGYLL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "argyll.keycloakSecret" . }}
                  key: argyll-admin-password
            - name: ARGYLL_ENGINE_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "argyll.keycloakSecret" . }}
                  key: engine-client-secret
            - name: ARGYLL_AGENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "argyll.keycloakSecret" . }}
                  key: agent-client-secret
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          startupProbe:
            httpGet:
              path: /auth/health/started
              port: management
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /auth/health/ready
              port: management
          livenessProbe:
            httpGet:
              path: /auth/health/live
              port: management
          resources:
            {{- toYaml .Values.keycloak.resources | nindent 12 }}
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import
              readOnly: true
      volumes:
        - name: realm
          configMap:
            name: {{ $name }}-realm
{{- end }}
