x-step-env: &step-env
  ARGYLL_ENGINE_URL: http://argyll-engine-1:8080

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: argyll
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d argyll"]
      interval: 3s
      timeout: 2s
      retries: 10

  argyll-engine-1:
    build:
      context: .
      dockerfile: engine/Dockerfile
    environment:
      API_PORT: "8080"
      API_HOST: "0.0.0.0"
      WEBHOOK_BASE_URL: http://argyll-engine-1:8080
      LOG_LEVEL: debug
      POSTGRES_URL: postgres://postgres:postgres@postgres:5432/argyll?sslmode=disable
      POSTGRES_PREFIX: argyll
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 8.8.4.4
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s

  argyll-ui:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    volumes:
      - ./web:/app
      - /app/node_modules # Don't mount node_modules
      - /app/dist # Don't mount dist directory
    ports:
      - "3001:3001"
    environment:
      - VITE_API_URL=http://localhost:8080
      - VITE_WS_URL=ws://localhost:8080/engine/ws
      - CHOKIDAR_USEPOLLING=true # For better file watching in Docker
      - NODE_ENV=development
    depends_on:
      argyll-engine-1:
        condition: service_healthy
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 8.8.4.4
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3001",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Example step services
  text-processor:
    build:
      context: .
      dockerfile: examples/simple-step/Dockerfile
    environment:
      <<: *step-env
      STEP_PORT: "8090"
      STEP_HOSTNAME: text-processor
    depends_on:
      argyll-engine-1:
        condition: service_healthy
    ports:
      - "8090:8090"
    restart: on-failure
    dns:
      - 8.8.8.8
      - 8.8.4.4
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 5s
      timeout: 3s
      retries: 8
      start_period: 10s

  user-resolver:
