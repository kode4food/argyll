# Example services sign in to the engine with the demo-services service account, and reach it
# through the gateway like any client
x-step-env: &step-env
  ARGYLL_URL: http://gateway:8080
  ARGYLL_TOKEN_URL: http://keycloak:8080/auth/realms/argyll/protocol/openid-connect/token
  ARGYLL_CLIENT_ID: demo-services
  ARGYLL_CLIENT_SECRET: argyll-demo-services-secret

# Agent workers call the Argyll MCP server as the agent-workers service account
x-agent-env: &agent-env
  ARGYLL_MCP_URL: http://mcp.tools:8071/mcp
  ARGYLL_TOKEN_URL: http://keycloak:8080/auth/realms/argyll/protocol/openid-connect/token
  ARGYLL_CLIENT_ID: agent-workers
  ARGYLL_CLIENT_SECRET: argyll-demo-agent-secret

x-agent-workers: &agent-workers "anthropic=http://agent-anthropic.workers:8070,bedrock=http://agent-bedrock.workers:8070,gemini=http://agent-gemini.workers:8070,*=http://agent-openai.workers:8070"

x-step-depends: &step-depends
  keycloak:
    condition: service_healthy
  gateway:
    condition: service_healthy

x-step-networks: &step-networks
  - edge
  - auth

# People and services sign in through Keycloak. Turn authentication off with
# AUTH_PROVIDER=none docker compose up
x-auth-env: &auth-env
  AUTH_PROVIDER: ${AUTH_PROVIDER:-oidc}
  AUTH_ISSUER: ${ARGYLL_PUBLIC_URL:-http://localhost:8080}/auth/realms/argyll
  AUTH_JWKS_URL: http://keycloak:8080/auth/realms/argyll/protocol/openid-connect/certs
  AUTH_AUDIENCE: argyll

# The engine signs in to agent workers as the argyll-engine service account
x-engine-account: &engine-account
  ARGYLL_TOKEN_URL: http://keycloak:8080/auth/realms/argyll/protocol/openid-connect/token
  ARGYLL_CLIENT_ID: argyll-engine
  ARGYLL_CLIENT_SECRET: argyll-demo-engine-secret

x-engine-env: &engine-env
  <<: [*auth-env, *engine-account]
  API_PORT: "8080"
  # Steps and agent workers send callbacks through the gateway, which routes them to the leader
  WEBHOOK_BASE_URL: http://gateway:8080
  AGENT_WORKERS: *agent-workers
  LOG_LEVEL: debug
  RAFT_SERVERS: "argyll-1=engine-1.raft:9701,argyll-2=engine-2.raft:9701,argyll-3=engine-3.raft:9701"
  RAFT_DATA_DIR: /data/argyll-raft

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: ${ARGYLL_PUBLIC_URL:-http://localhost:8080}/auth
      # The realm import fills its redirect URIs from this
      ARGYLL_PUBLIC_URL: ${ARGYLL_PUBLIC_URL:-http://localhost:8080}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/argyll-realm.json:/opt/keycloak/data/import/argyll-realm.json:ro
      - ./keycloak/themes/argyll:/opt/keycloak/themes/argyll:ro
    networks:
      - auth
    restart: unless-stopped
    healthcheck:
      # The image has no curl, so the shell asks the management port directly
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/localhost/9000 &&
          printf 'GET /auth/health/ready HTTP/1.0\r\n\r\n' >&3 &&
          grep -q UP <&3
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

  gateway:
    image: haproxy:3.1-alpine
    depends_on:
      engine-1:
        condition: service_healthy
      engine-2:
        condition: service_healthy
      engine-3:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      - edge
      - api
      - auth
      - chat
      - ui
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 8.8.4.4
    healthcheck:
      test: ["CMD", "haproxy", "-c", "-f", "/usr/local/etc/haproxy/haproxy.cfg"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  engine-1:
    build:
      context: .
      dockerfile: engine/Dockerfile
    environment:
      <<: *engine-env
      API_HOST: engine-1.api
      RAFT_NODE_ID: argyll-1
      RAFT_ADDRESS: engine-1.raft:9701
    volumes:
      - data-1:/data
    networks:
      edge: {}
      auth: {}
      workers-anthropic: {}
      workers-bedrock: {}
      workers-gemini: {}
      workers-openai: {}
      api:
        aliases: [engine-1.api]
      raft:
        aliases: [engine-1.raft]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 8.8.4.4
    healthcheck:
      test: ["CMD", "curl", "-f", "http://engine-1.api:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s

  engine-2:
    build:
      context: .
      dockerfile: engine/Dockerfile
    environment:
      <<: *engine-env
      API_HOST: engine-2.api
      RAFT_NODE_ID: argyll-2
      RAFT_ADDRESS: engine-2.raft:9701
    volumes:
      - data-2:/data
    networks:
      edge: {}
      auth: {}
      workers-anthropic: {}
      workers-bedrock: {}
      workers-gemini: {}
      workers-openai: {}
      api:
        aliases: [engine-2.api]
      raft:
        aliases: [engine-2.raft]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 8.8.4.4
    healthcheck:
      test: ["CMD", "curl", "-f", "http://engine-2.api:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s

  engine-3:
    build:
      context: .
      dockerfile: engine/Dockerfile
    environment:
      <<: *engine-env
      API_HOST: engine-3.api
      RAFT_NODE_ID: argyll-3
      RAFT_ADDRESS: engine-3.raft:9701
    volumes:
      - data-3:/data
    networks:
      edge: {}
      auth: {}
      workers-anthropic: {}
      workers-bedrock: {}
      workers-gemini: {}
      workers-openai: {}
      api:
        aliases: [engine-3.api]
      raft:
        aliases: [engine-3.raft]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 8.8.4.4
    healthcheck:
      test: ["CMD", "curl", "-f", "http://engine-3.api:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s

  mcp:
    build:
      context: .
      dockerfile: mcp/Dockerfile
    command: ["-url", "http://gateway:8080", "-listen", "mcp.tools:8071"]
    networks:
      edge: {}
      tools:
        aliases: [mcp.tools]
    restart: unless-stopped

  # Chat reaches only the agent workers, never the engine
  chat:
    build:
      context: .
      dockerfile: chat/Dockerfile
    depends_on:
      - agent-anthropic
      - agent-bedrock
      - agent-gemini
      - agent-openai
    environment:
      <<: *auth-env
      HOST: chat.web
      AGENT_WORKERS: *agent-workers
    networks:
      auth: {}
      workers-anthropic: {}
      workers-bedrock: {}
      workers-gemini: {}
      workers-openai: {}
      chat:
        aliases: [chat.web]
    restart: unless-stopped

  agent-anthropic:
    build:
      context: .
      dockerfile: workers/agent/Dockerfile
      args:
        WORKER: argyll-agent-anthropic
    depends_on:
      - mcp
    environment:
      <<: [*auth-env, *agent-env]
      HOST: agent-anthropic.workers
    env_file:
      - path: ./.env.d/agent.env
        required: false
      - path: ./.env.d/agent-anthropic.env
        required: false
    networks:
      edge: {}
      auth: {}
      tools: {}
      workers-anthropic:
        aliases: [agent-anthropic.workers]
    restart: unless-stopped

  agent-bedrock:
    build:
      context: .
      dockerfile: workers/agent/Dockerfile
      args:
        WORKER: argyll-agent-bedrock
    depends_on:
      - mcp
    environment:
      <<: [*auth-env, *agent-env]
      HOST: agent-bedrock.workers
    env_file:
      - path: ./.env.d/agent.env
        required: false
      - path: ./.env.d/agent-bedrock.env
        required: false
    networks:
      edge: {}
      auth: {}
      tools: {}
      workers-bedrock:
        aliases: [agent-bedrock.workers]
    restart: unless-stopped

  agent-gemini:
    build:
      context: .
      dockerfile: workers/agent/Dockerfile
      args:
        WORKER: argyll-agent-gemini
    depends_on:
      - mcp
    environment:
      <<: [*auth-env, *agent-env]
      HOST: agent-gemini.workers
    env_file:
      - path: ./.env.d/agent.env
        required: false
      - path: ./.env.d/agent-gemini.env
        required: false
    networks:
      edge: {}
      auth: {}
      tools: {}
      workers-gemini:
        aliases: [agent-gemini.workers]
    restart: unless-stopped

  agent-openai:
    build:
      context: .
      dockerfile: workers/agent/Dockerfile
      args:
        WORKER: argyll-agent-openai
    depends_on:
      - mcp
    environment:
      <<: [*auth-env, *agent-env]
      HOST: agent-openai.workers
    env_file:
      - path: ./.env.d/agent.env
        required: false
      - path: ./.env.d/agent-openai.env
        required: false
    networks:
      edge: {}
      auth: {}
      tools: {}
      workers-openai:
        aliases: [agent-openai.workers]
    restart: unless-stopped

  ui:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    volumes:
      - ./web:/app
      - /app/node_modules # Don't mount node_modules
      - /app/dist # Don't mount dist directory
    environment:
      - VITE_AUTH_PROVIDER=${AUTH_PROVIDER:-oidc}
      - VITE_AUTH_CLIENT_ID=argyll-web
      - CHOKIDAR_USEPOLLING=true # For better file watching in Docker
      - NODE_ENV=development
    networks:
      - ui
      # The dev server installs packages when it starts
      - ui-egress
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 8.8.4.4
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3001",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Example step services
  text-processor:
    build:
      context: .
      dockerfile: examples/simple-step/Dockerfile
    environment:
      <<: *step-env
      STEP_PORT: "8090"
      STEP_HOSTNAME: text-processor
    depends_on: *step-depends
    networks: *step-networks
    restart: on-failure
    dns:
      - 8.8.8.8
      - 8.8.4.4
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 5s
      timeout: 3s
      retries: 8
      start_period: 10s

  user-resolver:
    build:
      context: .
      dockerfile: examples/user-resolver/Dockerfile
    environment:
      <<: *step-env
      STEP_PORT: "8091"
      STEP_HOSTNAME: user-resolver
    depends_on: *step-depends
    networks: *step-networks
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 8.8.4.4
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8091/health"]
      interval: 5s
      timeout: 3s
      retries: 8
      start_period: 10s

  inventory-resolver:
    build:
      context: .
      dockerfile: examples/inventory-resolver/Dockerfile
    environment:
      <<: *step-env
      STEP_PORT: "8092"
      STEP_HOSTNAME: inventory-resolver
    depends_on: *step-depends
    networks: *step-networks
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 8.8.4.4
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8092/health"]
      interval: 5s
      timeout: 3s
      retries: 8
      start_period: 10s

  order-creator:
    build:
      context: .
      dockerfile: examples/order-creator/Dockerfile
    environment:
      <<: *step-env
      STEP_PORT: "8093"
      STEP_HOSTNAME: order-creator
    depends_on: *step-depends
    networks: *step-networks
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 8.8.4.4
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8093/health"]
      interval: 5s
      timeout: 3s
      retries: 8
      start_period: 10s

  payment-processor:
    build:
      context: .
      dockerfile: examples/payment-processor/Dockerfile
    environment:
      <<: *step-env
      STEP_PORT: "8094"
      STEP_HOSTNAME: payment-processor
    depends_on: *step-depends
    networks: *step-networks
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 8.8.4.4
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8094/health"]
      interval: 5s
      timeout: 3s
      retries: 8
      start_period: 10s

  stock-reservation:
    build:
      context: .
      dockerfile: examples/stock-reservation/Dockerfile
    environment:
      <<: *step-env
      STEP_PORT: "8095"
      STEP_HOSTNAME: stock-reservation
    depends_on: *step-depends
    networks: *step-networks
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 8.8.4.4
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8095/health"]
      interval: 5s
      timeout: 3s
      retries: 8
      start_period: 10s

  notification-sender:
    build:
      context: .
      dockerfile: examples/notification-sender/Dockerfile
    environment:
      <<: *step-env
      STEP_PORT: "8096"
      STEP_HOSTNAME: notification-sender
    depends_on: *step-depends
    networks: *step-networks
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 8.8.4.4
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8096/health"]
      interval: 5s
      timeout: 3s
      retries: 8
      start_period: 10s

# Each network joins a server with the clients it serves, and servers that join several listen
# only on their own network's alias. The gateway is the one entry point from outside
networks:
  # The gateway's clients and outbound access for engines, workers, and Steps
  edge: {}
  api:
    internal: true
  raft:
    internal: true
  auth:
    internal: true
  chat:
    internal: true
  ui:
    internal: true
  ui-egress: {}
  # One per worker, so workers never reach each other
  workers-anthropic:
    internal: true
  workers-bedrock:
    internal: true
  workers-gemini:
    internal: true
  workers-openai:
    internal: true
  tools:
    internal: true

volumes:
  data-1:
  data-2:
  data-3:
